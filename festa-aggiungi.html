<!DOCTYPE html>
<!-- KC-BUILD: festa-aggiungi v1 · 2026-11-07 · FESTA ED ESPERIENZA ARRAMPICATA: BAMBINI IN PIÙ DOPO LA PRENOTAZIONE (decisioni Marco 7 nov, DB prenotazioni_festa_aggiunte, stripe-worker v3.98): pagina NUOVA, noindex e fuori sitemap, niente Pixel e niente banner cookie; ci si arriva dal link personale nella mail di conferma della festa (?f=<festa_id>, che fa da chiave). Stile di festa.html. Legge GET /festa-stato (solo data, orario, bambini, prezzo, termine: nessun dato personale) e mostra "Festa del sabato <data>, <orario>" e "Bambini già prenotati: <n>". Aggiunte aperte: scelta del numero da 1 a max_aggiungibili, totale n × €/bambino, bottone "Paga <totale> € e aggiungi" → POST /festa-aggiungi → Stripe; sotto la frase di Marco sul numero e sul termine. Aggiunte chiuse (dal giorno dopo data − 4 giorni): "Il numero dei bambini è chiuso dal <termine>…" e bottone WhatsApp di Marco. Uscita a metà: "Sei sicuro?" (beforeunload). Errori del Worker mostrati con il loro messaggio. Ritorno da Stripe con annulla: stessa pagina. -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aggiungi bambini alla festa · Accademia RCC · KataClimb</title>
<link rel="icon" href="/favicon-192x192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F4F5; --bg3:#0A0A0A;
  --ink:#0A0A0A; --ink2:#404040; --ink-on-dark2:#D4D4D4;
  --border:#E5E5E5; --border2:#D4D4D4; --yellow:#FACC15; --r:8px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.55}
@keyframes spin{to{transform:rotate(360deg)}}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border);gap:12px}
.header .logo{height:32px;width:auto;display:block}
.header .logo-rcc{height:28px}
.hero{background:#0A0A0A;color:#fff;text-align:center;padding:32px 22px 36px}
.hero h1{font-size:clamp(26px,6.5vw,38px);font-weight:900;line-height:1.1;letter-spacing:-.025em;margin:0 auto 12px;max-width:680px}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{color:var(--ink-on-dark2);font-size:17px;max-width:560px;margin:0 auto}
.section{max-width:620px;margin:0 auto;padding:28px 16px}
#carica{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px;padding:18px 0}
.sp{width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.festa{background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:18px}
.festa .t{font-size:18px;font-weight:900;text-transform:none}
.festa .s{font-size:15px;color:var(--ink2);margin-top:4px}
.f{margin-bottom:14px}
.f label{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.f select{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r);font-family:inherit;font-size:17px;background:#fff;color:var(--ink)}
.tot{font-size:16px;margin:4px 0 16px}
.tot b{font-size:20px}
.frase{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:var(--r-pill);padding:15px;font-family:inherit;font-size:17px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}
.btn .sp{border-color:rgba(255,255,255,.4);border-top-color:#fff;width:16px;height:16px;display:none}
.btn.loading .sp{display:inline-block}
.chiuso{background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--r);padding:14px;font-size:15px;color:#78350F;line-height:1.5;margin-bottom:14px}
.errore{display:none;background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;border-radius:var(--r);padding:10px 12px;font-size:14px;line-height:1.45;margin-top:12px}
.errore a{color:inherit;font-weight:700}
.footer{background:var(--bg3);color:var(--ink-on-dark2);text-align:center;padding:28px 20px;font-size:13px;margin-top:40px}
.footer a{color:#fff}
</style>
</head>
<body>

<header class="header">
  <img src="/logo-rcc.png" alt="Accademia RCC" class="logo logo-rcc">
  <img src="/kataclimb-logo.svg" alt="KataClimb" class="logo">
</header>

<section class="hero">
  <h1>Aggiungi <em>bambini</em> alla festa</h1>
  <p>Appena sapete quanti saranno: in base al numero reclutiamo gli istruttori.</p>
</section>

<section class="section">
  <div id="carica"><span class="sp"></span> Carico la prenotazione…</div>
  <div class="errore" id="errore-carica"></div>

  <div id="vista" hidden>
    <div class="festa">
      <div class="t" id="festa-quando"></div>
      <div class="s" id="festa-bambini"></div>
    </div>

    <div id="aperta" hidden>
      <div class="f">
        <label for="n">Quanti bambini aggiungete?</label>
        <select id="n"></select>
      </div>
      <p class="tot" id="tot"></p>
      <button type="button" class="btn" id="paga"><span class="sp"></span><span id="paga-label"></span></button>
      <div class="errore" id="errore"></div>
      <p class="frase" id="frase"></p>
    </div>

    <div id="chiusa" hidden>
      <div class="chiuso" id="chiuso-txt"></div>
      <a class="btn" href="https://wa.me/393318743953" target="_blank" rel="noopener">Scrivi a Marco su WhatsApp</a>
    </div>
  </div>
</section>

<footer class="footer">
  Accademia ArrampiKata RCC · Via Cassia 1634, La Storta, Roma<br>
  <a href="https://kataclimb.com">kataclimb.com</a>
</footer>

<script>
(function(){
  'use strict';
  var WORKER_URL = 'https://stripe-worker.marconescatelli.workers.dev';
  var WA = '<a href="https://wa.me/393318743953">WhatsApp</a>';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var festaId = new URLSearchParams(location.search).get('f') || '';
  var stato = null, sporco = false, pagando = false;

  function dataLabel(iso, conGiorno){
    var p = String(iso || '').slice(0, 10).split('-').map(Number);
    if (!p[0]) return '';
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('it-IT', conGiorno === false
      ? { day: 'numeric', month: 'long' } : { weekday: 'long', day: 'numeric', month: 'long' });
  }
  // il messaggio del Worker resta com'è: la parola WhatsApp diventa il link a Marco
  function conLink(msg){ return esc(msg).replace('WhatsApp', WA); }
  function totale(){ return stato ? stato.euro_bambino * Number($('n').value || 0) : 0; }
  function aggiornaTotale(){
    var n = Number($('n').value || 0);
    $('tot').innerHTML = n + ' × ' + esc(stato.euro_bambino) + ' € = <b>' + totale() + ' €</b>';
    $('paga-label').textContent = 'Paga ' + totale() + ' € e aggiungi';
  }
  function errore(id, msg){ var e = $(id); e.innerHTML = msg; e.style.display = msg ? 'block' : 'none'; }

  window.addEventListener('beforeunload', function(e){
    if (!sporco || pagando) return;
    e.preventDefault(); e.returnValue = 'Sei sicuro? I bambini scelti non sono ancora aggiunti.';
    return e.returnValue;
  });

  async function carica(){
    if (!/^[0-9a-f-]{36}$/i.test(festaId)){
      $('carica').hidden = true;
      errore('errore-carica', 'Il link non è completo: aprilo di nuovo dalla mail di conferma, oppure scrivi a Marco su ' + WA + '.');
      return;
    }
    try {
      var res = await fetch(WORKER_URL + '/festa-stato?f=' + encodeURIComponent(festaId));
      var d = await res.json().catch(function(){ return {}; });
      $('carica').hidden = true;
      if (!res.ok){ errore('errore-carica', conLink(d.message || 'Non riusciamo a leggere la prenotazione: riprova tra un minuto. Se si ripete scrivi a Marco su WhatsApp.')); return; }
      stato = d;
    } catch (e){
      $('carica').hidden = true;
      errore('errore-carica', 'Connessione instabile: ricarica la pagina. Se si ripete scrivi a Marco su ' + WA + '.');
      return;
    }
    $('festa-quando').textContent = 'Festa del sabato ' + dataLabel(stato.data, false) + ', ' + stato.orario;
    $('festa-bambini').textContent = 'Bambini già prenotati: ' + stato.n_bambini;
    $('vista').hidden = false;
    var termine = dataLabel(stato.termine);
    if (stato.aggiunte_aperte && stato.max_aggiungibili > 0){
      var opz = '';
      for (var i = 1; i <= stato.max_aggiungibili; i++) opz += '<option value="' + i + '">' + i + (i === 1 ? ' bambino' : ' bambini') + '</option>';
      $('n').innerHTML = opz;
      $('n').addEventListener('change', function(){ sporco = true; errore('errore', ''); aggiornaTotale(); });
      $('frase').textContent = 'Il numero dei bambini è importante: in base a quanti sono reclutiamo gli istruttori. Si possono aggiungere bambini fino a ' + termine + '. Se poi qualcuno non viene, la quota resta all\'Accademia.';
      aggiornaTotale();
      $('aperta').hidden = false;
    } else if (stato.aggiunte_aperte){
      $('chiuso-txt').textContent = 'La festa ha già il numero massimo di bambini. Per un gruppo più grande scrivi a Marco su WhatsApp.';
      $('chiusa').hidden = false;
    } else {
      $('chiuso-txt').textContent = 'Il numero dei bambini è chiuso dal ' + termine + ': gli istruttori sono già stati organizzati. Per qualsiasi cosa scrivi a Marco su WhatsApp.';
      $('chiusa').hidden = false;
    }
  }

  $('paga').addEventListener('click', async function(){
    var b = $('paga');
    errore('errore', '');
    b.disabled = true; b.classList.add('loading'); $('paga-label').textContent = 'Un attimo…';
    try {
      var res = await fetch(WORKER_URL + '/festa-aggiungi', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ festa_id: festaId, n_aggiunti: Number($('n').value) })
      });
      var d = await res.json().catch(function(){ return {}; });
      if (res.ok && d.url){ pagando = true; location.href = d.url; return; }
      errore('errore', conLink(d.message || 'Il pagamento non si è aperto. Riprova tra un minuto. Se si ripete scrivi a Marco su WhatsApp.'));
    } catch (e){
      errore('errore', 'Connessione instabile: riprova. Se si ripete scrivi a Marco su ' + WA + '.');
    }
    b.disabled = false; b.classList.remove('loading'); aggiornaTotale();
  });

  carica();
})();
</script>
</body>
</html>
