<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oggi · KataClimb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --nero:#000; --tile:#161618; --bianco:#FFF; --grigio:#9A9AA0; --velo:rgba(255,255,255,.08);
  --rosso:#FF3B30; --rosso2:#C81E1E;
  --corpo:#FF5A1F; --gravita:#0A84FF; --cordata:#30D158; --vuoto:#BF5AF2; --fiducia:#FFD60A;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--nero); color:var(--bianco);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4;
  max-width:480px; margin:0 auto; padding:10px 0 88px;
}
.mono{font-family:'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase}
a{color:inherit; text-decoration:none}
@media (prefers-reduced-motion:reduce){.pulsa{animation:none!important}}

/* login gate */
#gate{display:none; padding:80px 24px; text-align:center}
#gate h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:1.8rem; margin-bottom:10px}
#gate p{color:var(--grigio); font-size:.92rem; margin-bottom:24px}
#gate a{display:inline-block; padding:14px 28px; border-radius:12px; background:var(--fiducia); color:#000; font-weight:800; font-family:'JetBrains Mono',monospace; letter-spacing:.05em; font-size:.9rem}

/* console */
#app{display:none}
.console{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0 12px}
.full{grid-column:1/-1}
.due{grid-column:span 2}
.zona{grid-column:1/-1; padding:4px 2px 0; color:var(--grigio); font-weight:800; font-size:.56rem; display:flex; align-items:center; gap:8px}
.zona::after{content:''; flex:1; height:1px; background:var(--velo)}
.saluto{grid-column:1/-1; padding:2px 2px 4px; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:.82rem; letter-spacing:.05em}
.saluto b{color:var(--fiducia)}
.saluto span{color:var(--grigio); font-weight:600; font-size:13px; letter-spacing:.02em}

.t{
  border-radius:var(--r); padding:10px; min-height:88px; display:flex; flex-direction:column;
  background:var(--tile); border:1px solid var(--velo); position:relative; overflow:hidden;
  transition:transform .1s;
}
.t:active{transform:scale(.95)}
.t .et{font-weight:800; font-size:.52rem; margin-bottom:auto; opacity:.95}
.t .big{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.3rem; line-height:1.05}
.t .big small{font-size:13px; opacity:.7}
.t .cmd{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; letter-spacing:.08em; margin-top:3px}

/* ADESSO */
.t-adesso{flex-direction:row; align-items:center; gap:12px; min-height:0; padding:12px 14px;
  background:linear-gradient(135deg,var(--rosso),var(--rosso2)); border:none}
.t-adesso .ora{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.7rem; line-height:1}
.t-adesso .cosa{flex:1}
.t-adesso .cosa b{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:.85rem; letter-spacing:.05em; display:block}
.t-adesso .cosa span{font-size:13px; color:#FFE3E1}
.t-adesso .bell{font-size:13px; font-weight:800; background:rgba(0,0,0,.25); padding:5px 9px; border-radius:999px; white-space:nowrap}
.t-adesso.calmo{background:linear-gradient(135deg,#1B5E8E,#0E3A5C)}
.t-adesso.calmo .cosa span{color:#CFE6FF}
.pulsa{animation:pulsa 2.2s ease-in-out infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 0 7px rgba(255,59,48,0)}}

.t-avviso{border-color:rgba(255,59,48,.5)}
.t-avviso .et{color:#FF8A84}
.t-avviso .big{font-size:1.05rem}
.t-avviso .cmd{color:var(--rosso)}
.t-malaga{background:linear-gradient(145deg,#FFD60A,#FF9F0A 75%,#FF7A00); border:none; color:#1A1200}
.t-malaga .et{color:#5C4300}
.t-uscita{background:linear-gradient(140deg,#0A84FF,#0040C1); border:none}
.t-uscita .et{color:#CFE6FF}
.t-uscita .cmd{color:#FFF}

.t-sent .et{color:var(--grigio)}
.t-sent .cmd{color:var(--corpo)}
.fnodi{display:flex; gap:4px; margin-top:2px; flex-wrap:wrap}
.fn{width:8px; height:8px; border-radius:50%; border:1.2px solid var(--c)}
.fn.f{background:var(--c)}
.fn.o{background:var(--fiducia); border-color:var(--fiducia)}
.t-kata3{border-color:rgba(255,90,31,.5)}
.t-kata3 .et{color:#FF9A73}
.t-kata3 .big{font-size:.95rem}
.t-kata3 .cmd{color:var(--corpo)}
.t-mem{background:linear-gradient(140deg,#BF5AF2,#7A1FA8); border:none}
.t-mem .et{color:#EFD9FF}
.t-mem .vv{display:flex; gap:4px; margin-top:2px}
.t-mem .v{flex:1; height:30px; border-radius:8px; background:rgba(0,0,0,.32) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:.8rem}
.t-mem .v.oro{outline:1.5px solid var(--fiducia)}
.t-mem .cmd{color:#FFF}
.t-asc .et{color:var(--grigio)}
.t-asc .faccia{display:flex; gap:3px; margin-top:2px}
.t-asc button{flex:1; padding:7px 0; border-radius:8px; border:none; background:#222226; font-size:.95rem; cursor:pointer}
.t-asc button:active{background:#2E2E34}
.t-asc .cmd{color:var(--gravita)}
.t-parola .et{color:var(--grigio)}
.t-parola p{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:.86rem; line-height:1.25; color:var(--bianco)}
.t-parola .cmd{color:var(--fiducia)}
.t-corda .et{color:var(--grigio)}
.t-corda .big{font-size:1.05rem; color:var(--cordata)}
.t-corda .cmd{color:var(--cordata)}

/* ── tessere staff ── */
.t-sala .et{color:var(--grigio)}
.t-sala .big{color:var(--cordata)}
.t-sala .cmd{color:var(--cordata)}
.t-valida{background:linear-gradient(140deg,#BF5AF2,#7A1FA8); border:none}
.t-valida .et{color:#EFD9FF}
.t-valida .cmd{color:#FFF}
.t-lez{border-color:rgba(255,255,255,.14)}
.t-lez .et{color:var(--grigio)}
.t-lez .riga{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--velo); font-size:13px}
.t-lez .riga:last-of-type{border-bottom:none}
.t-lez .riga .h{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; width:48px; flex:none}
.t-lez .riga .n{margin-left:auto; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; color:var(--cordata)}
.t-lez .vuota{color:var(--grigio); font-size:13px; padding:8px 0}
.tag{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; letter-spacing:.08em; padding:3px 7px; border-radius:999px; flex:none; text-transform:uppercase}
.tag.open{background:rgba(255,214,10,.16); color:var(--fiducia)}
.tag.advance{background:rgba(10,132,255,.16); color:var(--gravita)}
.tag.intro_corda{background:rgba(48,209,88,.16); color:var(--cordata)}
.tag.evo_corda{background:rgba(191,90,242,.16); color:var(--vuoto)}
.tag.prima_lezione{background:rgba(48,209,88,.16); color:var(--cordata)}
.tag.altro{background:rgba(255,255,255,.1); color:var(--grigio)}
.t-coda .et{color:var(--grigio)}
.t-coda .cmd{color:var(--gravita)}
.t-nuovo{border-style:dashed; border-color:rgba(255,255,255,.25); align-items:center; justify-content:center; text-align:center}
.t-nuovo .big{font-size:1.5rem; color:var(--grigio)}
.t-nuovo .cmd{color:var(--grigio)}
.t-fasc .et{color:var(--grigio)}
.t-fasc .cmd{color:var(--fiducia)}
.t-switch{border-color:rgba(255,214,10,.35)}
.t-switch .et{color:var(--grigio)}
.t-switch .big{font-size:.95rem; color:var(--fiducia)}
.t-switch .cmd{color:var(--fiducia)}

.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:#222226; color:#fff;
  padding:12px 22px; border-radius:12px; font-size:.85rem; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50}
.toast.on{opacity:1}

.bar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex;
  background:rgba(13,13,15,.94); backdrop-filter:blur(12px); border-top:1px solid var(--velo);
  padding:7px 0 max(9px, env(safe-area-inset-bottom)); z-index:40}
.bar a{flex:1; text-align:center; color:var(--grigio); font-size:.62rem; letter-spacing:.05em}
.bar a span{display:block; font-size:1.2rem; margin-bottom:2px}
.bar a.attivo{color:var(--bianco)}
.bar a.attivo span{color:var(--fiducia)}

/* ── v2.0 DESKTOP: la console respira, non resta colonna-telefono nel nero ── */
@media (min-width:900px){
  body{max-width:760px; padding-top:28px; font-size:17px}
  .console{gap:12px; padding:0 16px}
  .saluto{font-size:1.05rem; padding-bottom:8px}
  .zona{font-size:.66rem; padding-top:10px}
  .t{min-height:112px; padding:14px; border-radius:20px}
  .t .et{font-size:.6rem}
  .t .big{font-size:1.7rem}
  .t .cmd{font-size:13px}
  .t-adesso .ora{font-size:2.2rem}
  .t-adesso .cosa b{font-size:1.05rem}
  .t-adesso .cosa span{font-size:13px}
  .fn{width:10px; height:10px}
  .t-mem .v{height:44px}
  .t-parola p{font-size:1rem}
  .bar{max-width:760px}
  .bar a{font-size:.7rem}
}
/* ── v2.1 SCHERMI LARGHI: console piena, 6 colonne ── */
@media (min-width:1200px){
  body{max-width:1280px; padding-top:16px; padding-bottom:96px}
  .console{grid-template-columns:repeat(6,1fr); gap:12px; padding:0 24px}
  .console > .t{grid-column:span 2}
  .t.due{grid-column:span 4}
  .t.full{grid-column:1/-1}
  .t{min-height:104px; padding:12px}
  .t .big{font-size:1.9rem}
  .t-adesso{padding:14px 18px}
  .t-adesso .ora{font-size:2.4rem}
  .zona{padding-top:6px}
  .bar{max-width:1280px; padding-top:10px}
  .bar a{font-size:.82rem}
  .bar a span{font-size:1.55rem; margin-bottom:3px}
}

     DEBITO-190: i numeri del pacchetto non stanno piu' qui, arrivano da get_contatori. */
  const[rp,rd]=await Promise.all([
    sb.from('profiles').select('nome, cognome, role, kata_certs').eq('user_id',uid).maybeSingle(),
    sb.from('profile_data').select('corso_attivo, frequenza_open, staff_role').eq('user_id',uid).maybeSingle()
  ]);
  profilo=rp.data||{};
  pdata=rd.data||{};

  /* DEBITO-190: la fotografia dei contatori, prima di disegnare qualsiasi numero. */
  try{
    const{data:cc}=await sb.rpc('get_contatori',{p_user_id:uid});
    contatori={}; (cc||[]).forEach(c=>{contatori[c.tipo_corso]=c});
  }catch(e){console.warn('[oggi] get_contatori:',e.message);contatori={}}

  /* vista: override ?vista= (collaudo/switch creator), poi ruolo */
  const vParam=new URLSearchParams(window.location.search).get('vista');
  if(['allievo','istruttore','segreteria','monitor'].includes(vParam)) vista=vParam;
  else if(SEG_ROLES.includes(profilo.role)) vista='segreteria';
  else if(STAFF_ISTRUTTORI.includes(pdata.staff_role)) vista='istruttore';
  else if(pdata.staff_role==='staff_monitor') vista='monitor';
  else vista='allievo';

  document.getElementById('app').style.display='block';

  if(vista==='segreteria'){ renderSegreteria(); loadSegAdesso(); loadSegSala(); loadSegCode(); loadIstrValida(); loadRendiconto(); loadDiario(); loadAllievi(); if(['creator','admin'].includes(profilo.role))loadCompensi(); loadEventi(); }
  else if(vista==='istruttore'){ renderIstruttore(); loadIstrLezioni(); loadAllievi(); loadMonitor(); loadEventi(); }
  else if(vista==='monitor'){ renderMonitor(); loadMonitor(); loadEventi(); }
  else { renderAllievo(); loadAdesso(); loadSentiero(); loadEventi(); mostraDichiarazione(); }
}

async function loadAdesso(){
  const el=document.getElementById('t-adesso');
  try{
    const oggiIso=isoLocal(new Date());
    const{data,error}=await sb.from('prenotazioni_corso')
      .select('id, data_lezione, stato, tipo_corso, corsi_attivi_settimanali(giorno_settimana, ora_inizio, ora_fine, istruttori(nome))')
      .eq('user_id',uid).eq('stato','prenotato')
      .gte('data_lezione',oggiIso)
      .order('data_lezione',{ascending:true})
      .limit(1);
    if(error)throw error;
    const p=(data||[])[0];
    const residue=creditoCorso();

    if(p){
      const cas=p.corsi_attivi_settimanali||{};
      const ora=(cas.ora_inizio||'').slice(0,5)||'—';
      const ist=cas.istruttori?.nome||'';

      const eOggi=isoLocal(d)===oggiIso;
      const corso=(p.tipo_corso||pdata.corso_attivo||'').toUpperCase().replace('_',' ');
      el.classList.add('pulsa');
      el.innerHTML=`
        <div class="ora">${esc(ora)}</div>

    }else if(pdata.corso_attivo && typeof residue==='number' && residue>0){
      el.classList.add('pulsa');

        <div class="ora">${residue}</div>
        <div class="cosa">
          <b>PRENOTA LA PROSSIMA.</b>
          <span>Hai ${residue} ${residue===1?'lezione':'lezioni'} che ti aspettano</span>

/* ── SENTIERO + PROSSIMO + MEMORIA + PAROLA: una sola query kata_videos ── */
async function loadSentiero(){
  try{
    const{data:v,error}=await sb.from('kata_videos').select('*').eq('user_id',uid);
    if(error)throw error;
    const vids=(v||[]).filter(x=>x.status!=='error');
    const perKata={};
    vids.forEach(x=>{ (perKata[x.kata_num]=perKata[x.kata_num]||[]).push(x); });
    const vissuti=Object.keys(perKata).map(Number).sort((a,b)=>a-b);
    const certs=new Set(
      Array.isArray(profilo.kata_certs)?profilo.kata_certs.map(Number):
      vids.filter(x=>x.status==='certified').map(x=>Number(x.kata_num))
    );
    document.getElementById('sent-num').innerHTML=vissuti.length+'<small>/33</small>';
    const nodi=[];
    FASCE.forEach(f=>{
      const campioni=f.da===33?[33]:[f.da, Math.floor((f.da+f.a)/2)];
      campioni.forEach(k=>{
        const cls=certs.has(k)?'o':(perKata[k]?'f':'');
        nodi.push(`<span class="fn ${cls}" style="--c:${f.c}"></span>`);
      });
    });
    document.getElementById('sent-nodi').innerHTML=nodi.join('');
    let next=null;
    for(let k=1;k<=33;k++){ if(!perKata[k]){next=k;break;} }
    document.getElementById('kata-next').textContent=next?('KATA '+String(next).padStart(2,'0')):'COMPLETO';
    const ptxt=document.getElementById('parola-txt'), pk=document.getElementById('parola-k');
    const kRef=next||33;
    if(PAROLE[kRef]){ ptxt.textContent=PAROLE[kRef]; pk.textContent='KATA '+String(kRef).padStart(2,'0')+' ›'; }
    else{ ptxt.textContent=KN[kRef]||''; pk.textContent='KATA '+String(kRef).padStart(2,'0')+' ›'; }
    const conData=vids.filter(x=>x.uploaded_at).sort((a,b)=>new Date(a.uploaded_at)-new Date(b.uploaded_at));
    if(conData.length){
      const primo=conData[0], ultimo=conData[conData.length-1];
      const cell=(x,oro)=>`<div class="v${oro?' oro':''}" ${x.thumbnail_url?`style="background-image:url('${esc(x.thumbnail_url)}')`+`"`:''}>${x.thumbnail_url?'':'▶'}</div>`;
      document.getElementById('mem-vv').innerHTML=cell(primo,false)+cell(ultimo,true);
    }
  }catch(e){ console.error('[sentiero]',e); }
}

async function loadIstrLezioni(){
  const adesso=document.getElementById('t-adesso');
  const righe=document.getElementById('lez-righe');
  try{
    /* T#149: corsi_attivi_settimanali.istruttore_id -> istruttori.id, lookup da user_id (come agenda live) */
    const{data:istr}=await sb.from('istruttori').select('id').eq('user_id',uid).maybeSingle();
    const iid=istr?.id||null;
    if(!iid){
      adesso.classList.add('calmo');
      adesso.innerHTML=`<div class="cosa"><b>RESPIRA.</b><span>Nessuna riga istruttore collegata al tuo profilo</span></div>`;
      righe.innerHTML=`<div class="vuota">—</div>`;
      return;
    }
    const{data:slots,error}=await sb.from('corsi_attivi_settimanali')
      .select('id, giorno_settimana, ora_inizio, ora_fine, tipo_corso, capienza_max')
      .eq('status','attivo').eq('istruttore_id',iid);
    if(error)throw error;

    const now=new Date();
    const gOggi=gsOggi(now);
    const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const oggiIso=isoLocal(now);
    const slotsOggi=(slots||[]).filter(s=>s.giorno_settimana===gOggi)
      .sort((a,b)=>String(a.ora_inizio).localeCompare(String(b.ora_inizio)));

    /* prenotati di oggi sui miei slot */
    const conteggi={};
    if(slotsOggi.length){
      const ids=slotsOggi.map(s=>s.id);
      const{data:pr}=await sb.from('prenotazioni_corso')
        .select('slot_id').eq('data_lezione',oggiIso).eq('stato','prenotato').in('slot_id',ids);
      (pr||[]).forEach(x=>{conteggi[x.slot_id]=(conteggi[x.slot_id]||0)+1;});
    }

    /* righe di oggi */
    if(slotsOggi.length){
      righe.innerHTML=slotsOggi.map(s=>{
        const tipo=s.tipo_corso||'';
        const cls=TIPO_LBL[tipo]?tipo:'altro';
        return `<div class="riga"><span class="h">${esc(String(s.ora_inizio).slice(0,5))}</span>`+
          `<span class="tag ${cls}">${esc(TIPO_LBL[tipo]||tipo)}</span>`+
          `<span class="n">${conteggi[s.id]||0}/${s.capienza_max??'—'}</span></div>`;
      }).join('');
    }else{
      righe.innerHTML=`<div class="vuota">Oggi nessuna lezione tua.</div>`;
    }

    /* ADESSO: prossima lezione di oggi non ancora finita, altrimenti prossimo giorno con slot */
    const prossOggi=slotsOggi.find(s=>String(s.ora_fine).slice(0,5)>hhmm);
    if(prossOggi){
      adesso.classList.add('pulsa');
      adesso.innerHTML=`
        <div class="ora">${esc(String(prossOggi.ora_inizio).slice(0,5))}</div>
        <div class="cosa">
          <b>IN SALA.</b>
          <span>${esc(TIPO_LBL[prossOggi.tipo_corso]||prossOggi.tipo_corso||'')} · ${conteggi[prossOggi.id]||0} prenotati · Accademia RCC</span>
        </div>
        <div class="bell">${slotsOggi.length} lez oggi</div>`;
    }else{
      /* prossimo giorno con uno slot (entro 7) */
      let trovato=null;
      for(let i=1;i<=7 && !trovato;i++){
        const d=new Date(now); d.setDate(d.getDate()+i);
        const g=gsOggi(d);
        const s=(slots||[]).filter(x=>x.giorno_settimana===g)
          .sort((a,b)=>String(a.ora_inizio).localeCompare(String(b.ora_inizio)))[0];
        if(s)trovato={s,d};
      }
      if(trovato){
        adesso.classList.add('pulsa');
        adesso.innerHTML=`
          <div class="ora">${esc(String(trovato.s.ora_inizio).slice(0,5))}</div>
          <div class="cosa">
            <b>TI ASPETTANO ${GIORNI[trovato.d.getDay()]} ${trovato.d.getDate()}</b>
            <span>${esc(TIPO_LBL[trovato.s.tipo_corso]||trovato.s.tipo_corso||'')} · Accademia RCC</span>
          </div>`;
      }else{
        adesso.classList.add('calmo');
        adesso.innerHTML=`<div class="cosa"><b>RESPIRA.</b><span>Nessuna lezione in calendario</span></div>`;
      }
    }
  }catch(e){
    adesso.innerHTML=`<div class="cosa"><b>APRI L'AGENDA</b><span>Non riesco a leggere le lezioni ora</span></div>`;
    righe.innerHTML=`<div class="vuota">—</div>`;
    console.error('[istr-lezioni]',e);
  }
}

   quindi il numero della tessera e' la lunghezza dell'elenco. */
/* REGOLA FERREA NOMENCLATURA: nomi per esteso, mai sigle */
const NOME_CORSO={
  prima_lezione:'Prima Lezione Adulti', prima_lezione_genitori:'Prima Lezione Genitori',
  prima_lezione_bambini:'Prima Lezione Bambini (6–11)', prima_lezione_ragazzi:'Prima Lezione Ragazzi (12–17)',
  open:'Corso Open KataClimb', advance:'Corso Advance KataClimb',
  intro_corda:'Corso Intro Corda KataClimb', evo_corda:'Corso Evo Corda KataClimb', fly:'Corso Fly KataClimb',
  bambini:'Corso Bambini (6–11)', ragazzi:'Corso Ragazzi (12–17)', giovani:'Corso Giovani KataClimb (18–24)',
  senior:'Corso Senior KataClimb (over 60)', evo_ragazzi:'Corso Evo Ragazzi', expert:'Corso Expert',
  lab:'Lab', monitor:'Sala con Monitor'
};
const nomeCorso=t=>t==='sala_monitor'?'Sala con Monitor':(NOME_CORSO[t]||(t?String(t).replace(/_/g,' '):''));
/* minori: il corso si deduce dalla fascia della Prima Lezione fatta; senza fascia nota, il nome del tab agenda */
function nomeMinori(tipo){
  if(tipo==='prima_lezione_bambini'||tipo==='bambini')return NOME_CORSO.bambini;
  if(tipo==='prima_lezione_ragazzi'||tipo==='ragazzi'||tipo==='evo_ragazzi')return NOME_CORSO.ragazzi;
  return 'Corso Bambini e Ragazzi';
}
const FUNNEL_PAROLE={
  nuovo:'Contatto nuovo, ancora da sentire', contattato:'Contattato, Prima Lezione non ancora prenotata',
  prenotato_prima_lezione:'Prima Lezione prenotata', fatta_prima_lezione:'Prima Lezione fatta, nessun corso',
  da_riprogrammare:'Prima Lezione da riprogrammare', perso:'Non prosegue', perso_prima_lezione:'Non prosegue dopo la Prima Lezione'
};
const FUNNEL_CORSO={open:'open',advance:'advance',intro:'intro_corda',evo:'evo_corda',fly:'fly'};
function funnelParole(st){
  if(!st)return 'Percorso non ancora registrato';
  if(FUNNEL_PAROLE[st])return FUNNEL_PAROLE[st];
  const m=/^(prenotato|iscritto|concluso)_(.+)$/.exec(st);
  if(m){
    const nc=FUNNEL_CORSO[m[2]]?nomeCorso(FUNNEL_CORSO[m[2]]):'Percorso '+m[2].replace(/_/g,' ');
    return nc+(m[1]==='prenotato'?': prenotazione fatta':m[1]==='iscritto'?': iscrizione attiva':': concluso');
  }
  return st.replace(/_/g,' ');
}

let allievi=[], filtroAll=null, schedaPid=null, schedaDati=null, ossAperta=false, schedaInHistory=false;
const _fotoUrl=new Map(); // path -> {url,exp}  (URL firmati 1h, come agenda v3.95)

const pad2=n=>String(n).padStart(2,'0');
function ggmm(s){ if(!s)return ''; const d=dLoc(s); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); }
function ggmmTs(ts){ if(!ts)return ''; const d=new Date(ts); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2); }
function iniziali(n,c){ return (((n||'').trim()[0]||'')+((c||'').trim()[0]||'')).toUpperCase()||'·'; }
/* come apriWhatsAppLead nel portale: via spazi e +, prefisso 39 se manca */
function waNum(tel){
  let t=(tel||'').replace(/[^0-9+]/g,''); if(!t)return '';
  t=t.replace(/^\+/,''); if(t.indexOf('39')!==0 && t.length<=10) t='39'+t;
  return t;
}
const telNum=tel=>(tel||'').replace(/[^0-9+]/g,'');
/* 🔴 mai sentito dopo la Prima: nessuna interazione dopo il giorno della Prima (T#134: giorno locale) */
function maiSentito(a){
  if(!a.ultima_interazione)return true;
  if(!a.data_prima)return false;
  return isoLocal(new Date(a.ultima_interazione))<=String(a.data_prima).slice(0,10);
}

function apriElenco(f){
  const p=document.getElementById('pann-all'); if(!p)return;
  if(filtroAll===f && !p.hidden){ p.hidden=true; filtroAll=null; return; }
  filtroAll=f; p.hidden=false;

}

function filtraAllievi(f){
  const L=allievi||[];
  if(f==='prima'||f==='corso'||f==='minori')return L.filter(a=>a.origine===f);
  if(f==='ultime')return L.filter(a=>a.ultima_lezione)
    .sort((a,b)=>String(a.prossima_lezione||'9999').localeCompare(String(b.prossima_lezione||'9999')));
  if(f==='richiamare')return L.filter(a=>a.da_richiamare)
    .map(a=>({a,r:maiSentito(a)?0:1}))
    .sort((x,y)=>x.r-y.r || (x.r===0
      ? String(x.a.data_prima||'').localeCompare(String(y.a.data_prima||''))
      : String(x.a.prossima_azione_il||'').localeCompare(String(y.a.prossima_azione_il||''))))
    .map(x=>x.a);
  return L;
}

function sottoRiga(a){
  if(a.origine==='corso' && a.corso_attivo){
    const p=[nomeCorso(a.corso_attivo)];
    if(a.totali!=null)p.push(`fatte ${a.fatte??0} su ${a.totali}`);
    if(a.restano!=null)p.push(`restano ${a.restano}`);
    if(a.data_fine_validita)p.push('scade '+ggmm(a.data_fine_validita));
    return p.join(' · ');
  }
  if(a.origine==='minori')return nomeMinori(a.tipo);
  let s=nomeCorso(a.tipo||'prima_lezione');
  if(a.data_prima){
    s+=' · '+ggmm(a.data_prima);
    const futura=String(a.data_prima).slice(0,10)>isoLocal(new Date());
    if(a.prima_presente==null)s+=futura?' · prenotata':' · non registrata';
    else if(a.prima_presente===false)s+=' · assente';
  }
  return s;
}

function avatarHtml(nome,cognome,path,xl){
  return `<span class="av${xl?' xl':''}"${path?` data-foto="${esc(path)}"`:''}>${esc(iniziali(nome,cognome))}</span>`;
}
async function applicaFoto(root){
  const els=[...root.querySelectorAll('.av[data-foto]')]; if(!els.length)return;
  const ora=Date.now();
  const daFirmare=[...new Set(els.map(e=>e.dataset.foto))].filter(p=>{const c=_fotoUrl.get(p);return !(c&&c.exp>ora);});
  if(daFirmare.length){
    try{
      const{data,error}=await sb.storage.from('riconoscimento').createSignedUrls(daFirmare,3600);
      if(error)throw error;
      (data||[]).forEach((r,i)=>{
        const p=(r&&r.path)||daFirmare[i];
        if(r&&r.signedUrl&&!r.error)_fotoUrl.set(p,{url:r.signedUrl,exp:ora+55*60000});
      });
    }catch(e){ console.warn('[foto riconoscimento]',e?.message||e); }
  }
  /* la foto sostituisce le iniziali solo se si carica davvero */
  els.forEach(el=>{
    const c=_fotoUrl.get(el.dataset.foto); if(!c)return;
    const im=new Image();
    im.onload=()=>{el.style.backgroundImage=`url("${c.url}")`; el.textContent='';};
    im.src=c.url;
  });
}

function disegnaElenco(){
  const p=document.getElementById('pann-all'); if(!p||!filtroAll)return;
  const chips=`<div class="chips">${FILTRI_ALL.map(([k,l])=>
    `<button class="chip${k===filtroAll?' on':''}" onclick="filtroAll='${k}';disegnaElenco()">${esc(k==='richiamare'?lblRichiamare():l)}</button>`).join('')}</div>`;
  if(!allievi){ p.innerHTML=chips+`<div class="vuota-all">Non riesco a leggere i tuoi allievi ora. Riprova tra poco.</div>`; return; }
  const L=filtraAllievi(filtroAll);
  if(!L.length){
    const msg=filtroAll==='richiamare'?'Nessun allievo da richiamare oggi.'
      :filtroAll==='ultime'?'Nessuna ultima lezione in arrivo.':'Nessun allievo in questo elenco.';
    p.innerHTML=chips+`<div class="vuota-all">${msg}</div>`; return;
  }
  p.innerHTML=chips+L.map(a=>{
    const b=[];
    if(a.ultima_lezione)b.push(`<i class="ult">🔚 ULTIMA</i>`);
    if(a.da_richiamare)b.push(`<i class="${maiSentito(a)?'r0':'r1'}" title="${maiSentito(a)?'Mai sentito dopo la Prima Lezione':'Richiamo scaduto'}">${maiSentito(a)?'🔴':'🟠'} 📞</i>`);
    if(a.n_osservazioni>0)b.push(`<i>📝 ${a.n_osservazioni}</i>`);
    return `<button class="all-riga" onclick="apriScheda('${esc(a.persona_id)}')">
      ${avatarHtml(a.nome,a.cognome,a.foto_path)}
      <span class="txt"><b>${esc((a.nome||'')+' '+(a.cognome||''))}</b><span>${esc(sottoRiga(a))}</span></span>
      <span class="bdg">${b.join('')}</span></button>`;
  }).join('');
  applicaFoto(p);
}

/* ── Scheda Allievo ── */
function apriScheda(pid,sala){
  schedaPid=pid; schedaDati=null; ossAperta=false;
  schedaSala=!!sala || vista==='monitor'; // v2.18: in testa il campo "Su cosa avete lavorato?" 
  const s=document.getElementById('scheda');
  document.getElementById('sch-corpo').innerHTML=`<p class="sch-vuoto">Un attimo, apro la scheda…</p>`;
  s.hidden=false; s.scrollTop=0;
  document.body.style.overflow='hidden';
  /* il tasto indietro del telefono chiude la scheda, non la pagina */
  if(!schedaInHistory){ history.pushState({kcScheda:1},''); schedaInHistory=true; }
  caricaScheda();
}
function nascondiScheda(){
  document.getElementById('scheda').hidden=true;
  document.body.style.overflow='';
  schedaPid=null; schedaDati=null; ossAperta=false; schedaSala=false;
}
function chiudiScheda(){
  if(schedaInHistory){ history.back(); return; } // popstate nasconde
  nascondiScheda();
}
window.addEventListener('popstate',()=>{ if(schedaInHistory){ schedaInHistory=false; nascondiScheda(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !document.getElementById('scheda').hidden)chiudiScheda(); });

async function caricaScheda(){
  const s=document.getElementById('scheda'), corpo=document.getElementById('sch-corpo');
  const pid=schedaPid, top=s.scrollTop;
  try{
    const{data,error}=await sb.rpc('get_scheda_allievo',{p_persona_id:pid});
    if(error)throw error;
    if(pid!==schedaPid)return; // scheda chiusa o cambiata nel frattempo
    schedaDati=data||{};
    disegnaScheda();
    s.scrollTop=top;
  }catch(e){
    if(pid!==schedaPid)return;
    console.error('[scheda]',e);
    /* v2.18: l'istruttore in turno puo' seguire in sala anche chi non e' suo allievo. La scheda
       gliela nega is_mio_allievo, l'annotazione no: resta il nome della ricerca e il campo Annota. */
    if(schedaSala && /tuo allievo/i.test(e?.message||'')){
      const n=_salaPersone[pid]||{};
      schedaDati={persona:{id:pid,nome:n.nome,cognome:n.cognome,foto_path:n.foto_path},riga:{},osservazioni:[],iscrizioni:[],ridotta:true,soloSala:true};
      disegnaScheda();
      return;
    }
    corpo.innerHTML=`<p class="sch-vuoto">${esc(e?.message||'Non riesco ad aprire la scheda ora.')}</p>`;
  }
}

function statoPercorsoTesto(R,P){
  if(R.corso_attivo){
    const p=[nomeCorso(R.corso_attivo)];

    if(R.restano!=null)p.push(`restano ${R.restano}`);
    if(R.data_fine_validita)p.push('scade '+ggmm(R.data_fine_validita));
    return p.join(' · ');
  }
  if(R.origine==='minori')return nomeMinori(R.tipo);
  if(R.data_prima){
    const n=nomeCorso(R.tipo||'prima_lezione'), g=ggmm(R.data_prima);
    if(String(R.data_prima).slice(0,10)>isoLocal(new Date()))return `${n} prenotata per il ${g}`;
    if(R.prima_presente===true)return `${n} fatta il ${g}`;
    if(R.prima_presente===false)return `${n} del ${g}: assente`;
    return `${n} del ${g}: presenza non registrata`;
  }
  return '';
}

      const k=eta<12?'bambini':eta<18?'ragazzi':'giovani';

let diario=[], diarioGiorni=14, diarioChip='tutti', _diarioTok=0, _diChiavi=['tutti'];
/* Un istruttore e' la sua utenza: le lezioni portano il nome della riga istruttori ("Marco Mellozzini (Mello)",
   "Claudia e Mattia" per lo slot condiviso, ripetuto una volta per membro), le osservazioni il nome del profilo.
   I chip si raggruppano per istruttore_user_id e usano il soprannome tra parentesi o il nome. */
const chiaveIstr=r=>r.istruttore_user_id||('n:'+(r.istruttore||'—'));
const daProfilo=r=>r.evento==='osservazione'||r.evento==='sala'; // nome dal profilo, non dalla riga istruttori
const condiviso=r=>!daProfilo(r) && / e /.test(r.istruttore||'');
function soprannome(n){ const m=/\(([^)]+)\)/.exec(n||''); return m?m[1].trim():String(n||'—').trim().split(/\s+/)[0]; }
function etichetteIstr(rows){
  const lab=new Map(), pri=new Map();
  rows.forEach(r=>{
    const k=chiaveIstr(r), n=r.istruttore||'—';
    let p,l;
    if(!r.istruttore_user_id){p=0;l=n;}
    else if(!condiviso(r) && !daProfilo(r)){p=0;l=soprannome(n);}
    else if(daProfilo(r)){p=1;l=soprannome(n);}
    else {p=2;l=n;}
    if(!lab.has(k)||p<pri.get(k)){lab.set(k,l);pri.set(k,p);}
  });
  /* chi compare solo nello slot condiviso: "Claudia e Mattia" -> la parte che nessun altro chip usa */
  lab.forEach((l,k)=>{
    if(pri.get(k)!==2)return;
    const altri=new Set([...lab].filter(([kk])=>kk!==k).map(([,v])=>v));
    const libera=l.split(/ e /).map(x=>x.trim()).filter(x=>x&&!altri.has(x));
    if(libera.length===1)lab.set(k,libera[0]);
  });
  return lab;
}

}

}
function disegnaDiario(){
  const box=document.getElementById('di-righe'), ch=document.getElementById('di-chips'); if(!box||!ch)return;
  if(!diario){ ch.innerHTML=''; box.innerHTML='<div class="vuota-all">Non riesco a leggere il diario ora.</div>'; return; }
  const lab=etichetteIstr(diario);
  if(diarioChip!=='tutti' && !lab.has(diarioChip))diarioChip='tutti';
  const chiavi=[...lab.keys()].sort((a,b)=>lab.get(a).localeCompare(lab.get(b),'it'));
  _diChiavi=['tutti',...chiavi]; // l'onclick passa l'indice: niente nomi dentro gli attributi
  ch.innerHTML=_diChiavi.map((k,i)=>
    `<button class="chip${k===diarioChip?' on':''}" onclick="diarioChip=_diChiavi[${i}];disegnaDiario()">${esc(k==='tutti'?'Tutti':lab.get(k))}</button>`).join('');
  let righe;
  if(diarioChip==='tutti'){
    const visti=new Set();
    righe=diario.filter(r=>{const k=[r.evento,r.quando,r.persona_id,r.istruttore].join('|'); if(visti.has(k))return false; visti.add(k); return true;});
  }else righe=diario.filter(r=>chiaveIstr(r)===diarioChip);
  if(!righe.length){ box.innerHTML='<div class="vuota-all">Nessuna attività registrata in questi giorni.</div>'; return; }
  let html='', giorno=null;
  righe.forEach(r=>{
    const g=String(r.giorno||'').slice(0,10);
    if(g!==giorno){ giorno=g; const d=dLoc(g); html+=`<div class="di-g">${GIORNI_FULL[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}</div>`; }
    const chi=esc(condiviso(r)?r.istruttore:(lab.get(chiaveIstr(r))||r.istruttore||'—'));
    const chiAllievo=`<b>${esc(r.allievo||'—')}</b>`;
    let corpo;
    if(r.evento==='lezione'){
      const st=r.dettaglio||'';
      corpo=`🧗 ${chi} · ${esc(nomeCorso(r.corso))} · ${chiAllievo} · <span class="${st==='assente'?'arancio':''}">${esc(st)}</span>`;
    }else if(r.evento==='prima'){
      const[st,es]=String(r.dettaglio||'').split(' · ');
      corpo=`⭐ ${chi} · ${esc(nomeCorso(r.corso||'prima_lezione'))} · ${chiAllievo} · <span class="${st==='non registrata'?'rosso':''}">${esc(st)}</span>`+
        (es?` · ${esc(ESITO_PRIMA[es]||es)}`:'');
    }else if(r.evento==='sala'){
      const tx=String(r.dettaglio||'').split('\n').map(x=>x.trim()).filter(Boolean).join(' · ');
      corpo=`🟢 ${chi} · Sala con Monitor · ${chiAllievo}`+(tx?`<div class="dt">${esc(tx)}</div>`:'');
    }else{
      const sc=r.scala||{};
      const scl=SCALE.filter(([k])=>sc[k]!=null).map(([k,l])=>`<span>${l} ${pallini(sc[k])}</span>`).join('');
      corpo=`📝 ${chi} · ${chiAllievo}${r.corso?' · '+esc(nomeCorso(r.corso)):''}`+
        (scl?`<div class="scl">${scl}</div>`:'')+(r.dettaglio?`<div class="dt">${esc(r.dettaglio)}</div>`:'');
    }
    html+=r.persona_id?`<button class="di-r" onclick="apriScheda('${esc(r.persona_id)}')">${corpo}</button>`:`<div class="di-r">${corpo}</div>`;
  });
  box.innerHTML=html;
}

  }catch(e){ console.error('[monitor]',e); salaOggi=null; }
  disegnaTurno(); disegnaSalaOggi(); disegnaTurni();
  if(schedaSala && schedaDati && !document.getElementById('scheda').hidden)disegnaScheda();
}

function disegnaTurno(){
  const el=document.getElementById('turno-corpo'); if(!el)return;
  if(!salaOggi){ el.innerHTML='<p class="vuota-all">Non riesco a leggere il turno ora. Riprova tra poco.</p>'; return; }
  const t=salaOggi.turno, n=(salaOggi.seguiti||[]).length;
  if(t && !t.fine){
    el.innerHTML=`<p class="turno-stato">In turno dalle <b>${hhmm(t.inizio)}</b> · ${n} ${n===1?'persona seguita':'persone seguite'}</p>
      <div class="frm"><label>Com'è andata la sala? (facoltativo)</label><textarea id="turno-nota"></textarea></div>
      <div class="sch-btns"><button class="btn fine" onclick="salaTurno('fine',this)">FINE TURNO</button></div>`;
    return;
  }
  el.innerHTML=(t?`<p class="turno-stato">Turno ${hhmm(t.inizio)} → ${hhmm(t.fine)} · ${n} ${n===1?'persona seguita':'persone seguite'}</p>`:'')+
    `<div class="sch-btns"><button class="btn prim grande" onclick="salaTurno('inizio',this)">INIZIO TURNO</button></div>`;
}
async function salaTurno(az,btn){
  let note=null;
  if(az==='fine'){
    if(!confirm('Chiudi il turno adesso?'))return;
    note=(document.getElementById('turno-nota')?.value||'').trim()||null;
  }
  btn.disabled=true;
  const{data,error}=await sb.rpc('monitor_turno',{p_azione:az,p_note:note});
  if(error){ btn.disabled=false; toast('Turno non registrato: '+error.message); return; }
  toast(az==='inizio'?(data?.gia_aperto?'Il turno era già aperto.':'Turno iniziato. Buona sala!'):'Turno chiuso. Grazie!');
  loadMonitor();
}

function salaCerca(q){
  clearTimeout(_salaTimer);
  const box=document.getElementById('sala-ris'); if(!box)return;
  q=(q||'').trim();
  if(q.length<2){ _salaTok++; box.innerHTML=''; return; }
  _salaTimer=setTimeout(async()=>{
    const tok=++_salaTok;
    const{data,error}=await sb.rpc('cerca_persona_staff',{p_q:q});
    if(tok!==_salaTok)return;
    if(error){ box.innerHTML=`<div class="vuota-all">Non riesco a cercare ora.</div>`; return; }
    const L=data||[];
    if(!L.length){ box.innerHTML=`<div class="vuota-all">Nessuno con questo nome.</div>`; return; }
    L.forEach(x=>{_salaPersone[x.persona_id]={nome:x.nome,cognome:x.cognome,foto_path:x.foto_path};});
    box.innerHTML=L.map(x=>`<button class="all-riga" onclick="apriScheda('${esc(x.persona_id)}',true)">
      ${avatarHtml(x.nome,x.cognome,x.foto_path)}<span class="txt"><b>${esc((x.nome||'')+' '+(x.cognome||''))}</b></span></button>`).join('');
    applicaFoto(box);
  },300);
}

/* blocco in testa alla scheda: le note di oggi vengono da monitor_oggi, cosi' valgono anche quando la scheda e' negata */
function htmlSalaScheda(d){
  const pid=schedaPid;
  const mio=((salaOggi&&salaOggi.seguiti)||[]).find(x=>x.persona_id===pid);
  const firma=esc([profilo.nome,profilo.cognome].filter(Boolean).join(' ')||'Tu');
  const righe=String(mio?.note||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=/^(\d{1,2}:\d{2})\s*—\s*(.*)$/.exec(x);
    return `<div class="dr mia"><div class="dh">${firma} · Sala con Monitor · ${esc(m?m[1]:'')}</div>${esc(m?m[2]:x)}</div>`;
  }).join('');
  const bloccata=ossMiaOggi(d); // stessa riga a DB dell'osservazione di oggi: annotare la mescolerebbe
  return `<section class="sch-sez sala-box"><h3>🟢 Sala con Monitor · oggi</h3>
    ${d.soloSala?`<p class="sch-vuoto">La scheda completa la vedono i suoi istruttori e la segreteria. Il lavoro di oggi in sala puoi annotarlo qui.</p>`:''}
    ${bloccata?`<p class="sch-vuoto">Oggi hai già scritto un'osservazione per questa persona: aggiungi il lavoro in sala nelle sue note, un'annotazione adesso si mescolerebbe con l'osservazione.</p>`:`
    <div class="frm">
      <label for="sala-cosa">Su cosa avete lavorato?</label>
      <input id="sala-cosa" placeholder="es. piedi sul circuito verde · prima calata in sicura · paura del vuoto">
      <label for="sala-nota">Nota (facoltativa)</label>
      <input id="sala-nota">
    </div>
    <div class="sch-btns"><button class="btn prim" onclick="salaAnnota(this)">ANNOTA</button></div>`}
    ${righe?`<div class="diario">${righe}</div>`:''}
  </section>`;
}
async function salaAnnota(btn){
  const pid=schedaPid; if(!pid)return;
  const cosa=(document.getElementById('sala-cosa')?.value||'').trim();
  const nota=(document.getElementById('sala-nota')?.value||'').trim()||null;
  if(cosa.length<3){ toast('Scrivi su cosa avete lavorato.'); document.getElementById('sala-cosa')?.focus(); return; }
  btn.disabled=true;
  const{error}=await sb.rpc('monitor_segna',{p_persona_id:pid,p_su_cosa:cosa,p_note:nota});
  if(error){ btn.disabled=false; toast('Non annotato: '+error.message); return; }
  toast('Annotato.');
  await loadMonitor();          // turno (si apre da solo) e tabella OGGI
  if(pid===schedaPid)caricaScheda();
}

function disegnaSalaOggi(){
  const el=document.getElementById('sala-oggi'); if(!el)return;
  if(!salaOggi){ el.innerHTML='<div class="vuota-all">Non riesco a leggere la sala ora.</div>'; return; }
  const L=salaOggi.seguiti||[];
  /* in console istruttore la tabella compare solo quando c'e' qualcosa: il turno in sala e' occasionale */
  const vuota=!L.length;
  if(vista==='istruttore'){ el.hidden=vuota; const z=document.getElementById('z-sala-oggi'); if(z)z.hidden=vuota; }
  if(vuota){ el.innerHTML='<div class="vuota-all">Nessuno ancora. Appena segui qualcuno, annotalo nella sua scheda.</div>'; return; }
  el.innerHTML=`<table class="tab"><thead><tr><th>Nome</th><th>Note</th><th>Ultimo aggiornamento</th></tr></thead><tbody>${
    L.map(x=>`<tr><td><button class="lnk" onclick="apriScheda('${esc(x.persona_id)}',true)">${esc(x.nome||'—')}</button></td>
      <td class="pre">${esc(x.note||'')}</td><td class="num">${hhmm(x.aggiornato)}</td></tr>`).join('')}</tbody></table>`;
}

function disegnaTurni(){
  const el=document.getElementById('sala-turni'); if(!el)return;
  if(!salaOggi){ el.innerHTML='<div class="vuota-all">Non riesco a leggere i turni ora.</div>'; return; }
  const L=salaOggi.storico||[];
  if(!L.length){ el.innerHTML='<div class="vuota-all">Nessun turno negli ultimi 30 giorni.</div>'; return; }
  const ora=new Date(), mese=ora.getFullYear()+'-'+pad2(ora.getMonth()+1);
  const delMese=L.filter(t=>String(t.data).slice(0,7)===mese);
  const totOre=delMese.reduce((a,t)=>a+Number(t.ore||0),0), totPers=delMese.reduce((a,t)=>a+Number(t.persone||0),0);
  el.innerHTML=`<table class="tab"><thead><tr><th>Data</th><th>Orario</th><th>Ore</th><th>Persone seguite</th><th>Nota di chiusura</th></tr></thead><tbody>${
    L.map(t=>`<tr><td>${giornoLungo(t.data)}</td><td class="num">${hhmm(t.inizio)} → ${t.fine?hhmm(t.fine):'<span class="arancio">in corso</span>'}</td>
      <td class="num">${numIt(t.ore)}</td><td class="num">${t.persone??0}</td><td>${esc(t.note_turno||'')}</td></tr>`).join('')
  }</tbody></table><p class="tab-tot">Totale di ${MESI[ora.getMonth()]}: ${numIt(totOre)} ore · ${totPers} ${totPers===1?'persona seguita':'persone seguite'}</p>`;
}

/* ── Compensi monitor (rendiconto, solo creator/admin) ── */
function htmlCompensiTessera(){
  return `<a class="t t-fasc full" id="t-comp" href="#compensi" role="button" onclick="apriCompensi();return false">
    <span class="et mono">💶 Compensi monitor · mese</span>
    <div class="big" id="comp-tot">…</div>
    <span class="cmd mono">DETTAGLIO ›</span>
  </a>
  <div class="full pann-all" id="comp-pann" hidden></div>`;
}
let compensi=null;
async function loadCompensi(){
  const o=new Date(), da=isoLocal(new Date(o.getFullYear(),o.getMonth(),1)), a=isoLocal(o);
  try{
    const{data,error}=await sb.rpc('get_compenso_monitor',{p_da:da,p_a:a});
    if(error)throw error;
    compensi=data||[];
  }catch(e){ console.error('[compensi]',e); compensi=null; }
  const t=document.getElementById('comp-tot');
  if(t)t.textContent=compensi?euro(compensi.reduce((s,r)=>s+Number(r.importo||0),0)):'—';
  const p=document.getElementById('comp-pann'); if(p && !p.hidden)disegnaCompensi();
}
function apriCompensi(){
  const p=document.getElementById('comp-pann'); if(!p)return;
  p.hidden=!p.hidden;
  if(!p.hidden){ disegnaCompensi(); p.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function disegnaCompensi(){
  const p=document.getElementById('comp-pann'); if(!p)return;
  const testa=`<p class="turno-regola">1 ora a 8 € per ogni persona seguita, le altre ore a 5 €.</p>`;
  if(!compensi){ p.innerHTML=testa+'<div class="vuota-all">Non riesco a leggere i compensi ora.</div>'; return; }
  if(!compensi.length){ p.innerHTML=testa+'<div class="vuota-all">Nessun turno in Sala con Monitor questo mese.</div>'; return; }
  const tot=new Map();
  compensi.forEach(r=>{ const k=r.monitor||'—'; const x=tot.get(k)||{ore:0,persone:0,importo:0};
    x.ore+=Number(r.ore||0); x.persone+=Number(r.persone||0); x.importo+=Number(r.importo||0); tot.set(k,x); });
  p.innerHTML=testa+`<table class="tab"><thead><tr><th>Data</th><th>Monitor</th><th>Orario</th><th>Ore</th><th>Persone</th><th>Importo</th></tr></thead><tbody>${
    compensi.map(r=>`<tr><td>${giornoLungo(r.data)}</td><td>${esc(r.monitor||'—')}</td>
      <td class="num">${hhmm(r.inizio)} → ${r.aperto?'<span class="arancio">ancora aperto</span>':hhmm(r.fine)}</td>
      <td class="num">${numIt(r.ore)}</td><td class="num">${r.persone??0}</td><td class="num">${euro(r.importo)}</td></tr>`).join('')
  }</tbody><tfoot>${[...tot].sort((a,b)=>a[0].localeCompare(b[0],'it')).map(([k,x])=>
    `<tr><td colspan="3"><b>Totale ${esc(k)}</b></td><td class="num">${numIt(x.ore)}</td><td class="num">${x.persone}</td><td class="num"><b>${euro(x.importo)}</b></td></tr>`).join('')
  }</tfoot></table>`;
}

/* ════════════════════════ EVENTI: condivisa da tutte le viste ════════════════════════ */
async function loadEventi(){
  try{
    const r=await fetch(CFG.SB_URL+'/rest/v1/rpc/get_eventi_calendario',{
      method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.SB_KEY,'Authorization':'Bearer '+CFG.SB_KEY},body:'{}'});
    if(!r.ok)throw new Error('rpc '+r.status);
    const ev=await r.json();
    const oggi=new Date(); oggi.setHours(0,0,0,0);
    let fut=(ev||[]).filter(e=>dLoc(e.data_inizio)>=oggi).sort((a,b)=>dLoc(a.data_inizio)-dLoc(b.data_inizio));
    /* dedupe v1.1: stessa data_inizio+tipo = stesso evento */
    const visti=new Set();
    fut=fut.filter(e=>{const k=e.data_inizio+'|'+e.tipo; if(visti.has(k))return false; visti.add(k); return true;});
    const T={viaggio:'✈',uscita_adulti:'⛰',uscita_ragazzi:'🧗',evento:'◆'};
    const fill=(id,e)=>{
      const el=document.getElementById(id); if(!el)return;
      if(!e){
        /* v2.0: niente buco — con un solo evento la seconda tessera diventa la scorciatoia EVENTI */
        el.href='/eventi.html';
        el.innerHTML=`
          <span class="et mono">✈ Eventi</span>
          <div class="big">◆</div>
          <span class="cmd mono">TUTTI ›</span>`;
        return;
      }
      const gg=Math.max(0,Math.round((dLoc(e.data_inizio)-oggi)/86400000));
      el.href='/evento.html?slug='+encodeURIComponent(e.slug);
      el.innerHTML=`
        <span class="et mono">${T[e.tipo]||'◆'} ${esc((e.nome||'').split('—')[0].trim().slice(0,14))}</span>
        <div class="big">${gg}<small>g</small></div>
        <span class="cmd mono">${e.n_iscritti>0?e.n_iscritti+' IN CORDATA ›':'GUARDA ›'}</span>`;
    };
    fill('t-ev1',fut[0]); fill('t-ev2',fut[1]);
  }catch(e){ console.error('[eventi]',e); }
}

/* ── DICHIARATI v1: solo locale, in attesa della decisione sulla struttura DB ── */
function dichiara(stato,emo){
  try{
    const k='kc_dichiarazioni';
    const log=JSON.parse(localStorage.getItem(k)||'[]');
    log.push({stato,emo,giorno:isoLocal(new Date()),quando:new Date().toISOString()});
    localStorage.setItem(k,JSON.stringify(log.slice(-90)));
  }catch(_){}
  mostraDichiarazione();
  toast(emo+' '+stato+'. Annotato — resta sul tuo telefono.');
}
function mostraDichiarazione(){
  try{
    const log=JSON.parse(localStorage.getItem('kc_dichiarazioni')||'[]');
    const oggi=isoLocal(new Date());
    const ultima=[...log].reverse().find(x=>x.giorno===oggi);
    const el=document.getElementById('asc-stato');
    if(el&&ultima){el.textContent='OGGI: '+(ultima.emo||'')+' '+ultima.stato.toUpperCase();el.style.color='var(--cordata)';}
  }catch(_){}
}
